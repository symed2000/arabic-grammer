<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Arabic Grammar Tree - Structural Lines Last</title>
    <style>
        body {
            background-color: #FAF8F5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        svg {
            width: 100%;
            max-width: 850px;
            height: auto;
        }

        /* Text styling */
        .word-text {
            font-size: 32px;
            font-weight: bold;
            text-anchor: middle;
        }
        .label-text {
            font-size: 13px;
            text-anchor: middle;
            fill: #555;
        }
        .structural-label {
            font-size: 15px;
            font-weight: bold;
            text-anchor: middle;
        }

        /* Structural Divider Lines */
        .base-line {
            stroke-width: 3;
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 1.5s ease-out forwards;
        }

        /* Dynamic Connecting Arrows */
        marker {
            fill: context-stroke;
        }
        .animated-link {
            fill: none;
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 2s ease-in-out forwards;
        }

        /* Global Keyframes */
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* --- RIGHT-TO-LEFT TIMING SEQUENCE --- */
        .step-1 { animation-delay: 0s; }   /* صلة */
        .step-2 { animation-delay: 5s; }   /* مفعول به */
        .step-3 { animation-delay: 10s; }  /* اسم أنّ */
        .step-4 { animation-delay: 15s; }  /* خبر أنّ */
        .step-5 { animation-delay: 20s; }  /* مضاف إليه */
        
        /* THE LAST STEP (25 seconds) */
        .last-step { animation-delay: 25s; } 
    </style>
</head>
<body>

<svg viewBox="0 0 850 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" />
        </marker>
    </defs>

    <!-- WORD TEXTS -->
    <text x="750" y="90" class="word-text" fill="#D4AC0D">ٱلَّذِينَ</text>
    <text x="600" y="90" class="word-text" fill="#2E6DA4">يَظُنُّونَ</text>
    <text x="450" y="90" class="word-text" fill="#A94442">أَنَّهُمْ</text>
    <text x="300" y="90" class="word-text" fill="#4A7BB0">مُلَٰقُواْ</text>
    <text x="120" y="90" class="word-text" fill="#8E7C6E">رَبِّهِمْ</text>

    <!-- BASE WORDS TYPE LABELS -->
    <text x="750" y="125" class="label-text">اسم موصول</text>
    <text x="600" y="125" class="label-text">فعل وفاعل</text>
    <text x="450" y="125" class="label-text">حرف نصب</text>
    <text x="300" y="125" class="label-text">اسم</text>
    <text x="120" y="125" class="label-text">مضاف إليه</text>


    <!-- STEP 1: ٱلَّذِينَ Connection (0s) -->
    <path class="animated-link step-1" d="M 750,140 Q 680,480 345,510" stroke="#D4AC0D" stroke-width="2.5" marker-end="url(#arrow)" />
    <text x="345" y="535" class="structural-label" fill="#D4AC0D" style="opacity: 0; animation: fadeIn 0.5s 1.5s forwards;">صلة</text>


    <!-- STEP 2: Mafu'l Bihi Arrow (5s) -->
    <path class="animated-link step-2" d="M 600,140 Q 600,340 450,360" stroke="#2E6DA4" stroke-width="2" marker-end="url(#arrow)" />
    <text x="450" y="385" class="label-text" style="opacity: 0; animation: fadeIn 0.5s 6.5s forwards;">مفعول به</text>


    <!-- STEP 3: Inner Clause Arrow (10s) -->
    <path class="animated-link step-3" d="M 450,140 Q 450,230 380,240" stroke="#A94442" stroke-width="2" marker-end="url(#arrow)" />
    <text x="380" y="265" class="label-text" style="opacity: 0; animation: fadeIn 0.5s 11.5s forwards;">اسم «أنّ»</text>


    <!-- STEP 4: Khabar 'Anna Link (15s) -->
    <path class="animated-link step-4" d="M 300,140 Q 300,200 215,200" stroke="#4A7BB0" stroke-width="2" marker-end="url(#arrow)" />
    <text x="215" y="225" class="label-text" style="opacity: 0; animation: fadeIn 0.5s 16.5s forwards;">خبر «أنّ»</text>


    <!-- STEP 5: Leftmost Possessive Link (20s) -->
    <path class="animated-link step-5" d="M 120,140 Q 120,170 160,170" stroke="#4A7BB0" stroke-width="2" marker-end="url(#arrow)" />
    <text x="160" y="190" class="label-text" style="opacity: 0; animation: fadeIn 0.5s 21.5s forwards;">مضاف إليه</text>


    <!-- FINAL STEP: Jumla Ismia and Jumla Faelia Lines Reveal Simultaneously (25s) -->
    
    <!-- Horizontal Green Line (Jumla Faelia) -->
    <line x1="600" y1="420" x2="60" y2="420" stroke="#1E8449" class="base-line last-step" />
    <circle cx="330" cy="435" r="4" fill="#1E8449" style="opacity: 0; animation: fadeIn 0.5s 26s forwards;" />
    <text x="330" y="460" class="structural-label" fill="#1E8449" style="opacity: 0; animation: fadeIn 0.5s 26.2s forwards;">جملة فعلية</text>

    <!-- Horizontal Dark Blue Line (Jumla Ismia) -->
    <line x1="450" y1="290" x2="60" y2="290" stroke="#0B3C5D" class="base-line last-step" />
    <circle cx="255" cy="305" r="4" fill="#0B3C5D" style="opacity: 0; animation: fadeIn 0.5s 26s forwards;" />
    <text x="255" y="330" class="structural-label" fill="#0B3C5D" style="opacity: 0; animation: fadeIn 0.5s 26.2s forwards;">جملة اسمية</text>

</svg>

</body>
</html>
